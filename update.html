<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepX 更新</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f6f7f9;color:#202124;display:grid;place-items:center}
.card{width:430px;padding:28px;background:#fff;border:1px solid #e0e4e9;border-radius:12px;box-shadow:0 10px 34px #20212414}
.brand{font-size:20px;margin:0 0 4px}
.sub{color:#68717d;font-size:13px;margin:0 0 16px;min-height:18px}
.row{display:flex;justify-content:space-between;font-size:13px;color:#444;margin-bottom:10px}
.track{height:9px;border-radius:6px;background:#e8ebef;overflow:hidden}
.track i{display:block;height:100%;width:0;background:#386cf6;transition:width .15s ease}
.stats{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#68717d;min-height:16px;gap:8px}
.btn{width:100%;margin-top:18px;padding:9px;border:0;border-radius:7px;background:#386cf6;color:#fff;font-size:14px;cursor:pointer}
.btn:disabled{background:#c3cddd;cursor:not-allowed}
.hint{margin-top:12px;font-size:11px;color:#a2aab4;min-height:14px;word-break:break-all}
#status.ok{color:#2a9d5a}#status.latest{color:#68717d}#status.err{color:#c23d3d}
</style>
</head>
<body>
  <section class="card">
    <h1 class="brand">DeepX 更新</h1>
    <p class="sub" id="sub">正在检查更新…</p>
    <div class="row"><span id="version">--</span><span id="status">--</span></div>
    <div class="track"><i id="bar"></i></div>
    <div class="stats"><span id="bytes">--</span><span id="speed">--</span><span id="eta">--</span></div>
    <button class="btn" id="start" disabled>开始更新</button>
    <div class="hint" id="hint"></div>
  </section>
  <script type="module" src="./frontend/update.js"></script>
</body>
</html>
