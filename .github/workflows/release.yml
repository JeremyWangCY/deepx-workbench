name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $config = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value

          if ($package -ne $config -or $package -ne $cargo) {
            throw "Version mismatch: package=$package config=$config cargo=$cargo"
          }
          if ($tag -ne "v$package") {
            throw "Tag $tag does not match project version v$package"
          }


      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled runtime
        run: pnpm prepare:runtime

      - name: Validate release candidate
        run: |
          pnpm typecheck
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build NSIS installer
        run: pnpm tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($installers.Count -eq 0) {
            throw "NSIS installer was not produced"
          }
          $installers | Select-Object FullName, Length

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            --title "DeepX Workbench ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
